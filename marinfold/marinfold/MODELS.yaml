# Registry of trained MarinFold models, by nickname. The `marinfold` CLI
# resolves `--model <nickname>` (or the `default: true` entry when `--model`
# is omitted) to the HF URL below, downloads it, and dispatches to the first
# `document_structures` impl the entry lists. See registry.py.

# Current best: exp166 (issue #166) — eric-czech's contacts-v1 amino-acid
# augmentation run, continued from the #117 sweep winner. Qwen3 1.47B, 8
# epochs, lr 3.1623e-3 / wd 0.1 / global batch 128, exp117 init;
# eval/tokenized/contacts-v1-val/loss 2.6642. R-precision 0.562 (all) / 0.513
# (long), AUC 0.939 on the 554-protein eval set — vs #117's 0.534 / 0.482, a
# paired +0.028 (95% CI 0.023–0.034), higher on 67% of proteins (#190, exp82
# rollout inference; see experiments/exp180_.../README.md for the full
# progression). contacts-v1 tokenizer co-located.
#
# This is OUR republished copy of eric-czech's export, not the original. The
# weights are byte-identical (both shards sha256-verified against the source);
# only config.json differs. His export was written by transformers 5.12.1 and
# states rope as a `rope_parameters` block, which the pinned transformers 4.x
# ignores in favour of the architecture default — loading rope_theta 10000
# where the model was trained with 500000, worth 0.76 nats/token on real
# documents, silently. Our copy states rope in both 4.x and 5.x terms, so a
# plain AutoModelForCausalLM.from_pretrained is correct with no marinfold code
# in the loop. See the PROVENANCE.md beside the weights,
# scripts/repair_checkpoint_config.py, and issue #180.
- nickname: contacts-v1-exp166-1.5B
  default: true
  url: https://huggingface.co/buckets/open-athena/MarinFold/tree/checkpoints/prot-exp166-cv1-aaaug-1_5b-e8-lr3p162e-3-wd0p1-bs128-exp117-init-us-east1/hf/step-35679
  wandb_url: https://wandb.ai/eric-czech/marin/runs/prot-exp166-cv1-aaaug-1_5b-e8-lr3p162e-3-wd0p1-bs128-exp117-init-us-east1
  document_structures:
    - contacts-v1
