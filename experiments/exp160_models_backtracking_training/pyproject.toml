[project]
name = "exp160-backtracking-training"
version = "0.0.0"
description = "Backtracking training + retraction diagnostics (issue #160)"
requires-python = ">=3.12,<3.13"  # fasttext-wheel (via marin-core) ships no cp313 wheel; on 3.13 it source-builds and needs Python.h
dependencies = [
    # NB: no torch pin here. An earlier revision carried `torch==2.5.1+cu121`
    # for the abandoned CoreWeave-GPU path; nothing in this experiment imports
    # torch, and the pin *conflicts* with `marin-core[tpu]`, which requires
    # torch==2.11.0 (CPU). Training runs on TPU — see the `tpu` extra below.
    # Pilot I/O: exp98 targets.parquet (GT + sequences) from the public bucket.
    "pandas>=2.0",
    "pyarrow",
    "huggingface_hub>=0.24",
    "numpy",
    "requests",
    "gcsfs",
    "boto3",
    # marin runtime in BASE (not an extra): the iris job env installs base deps
    # only, and the driver imports fray to submit the child JobRequest.
    "marin-fray>=0.2.40.dev202607080801",
    "marin-iris>=0.2.40.dev202607080801",
    # marin training path (build_train_lm_on_pod_config -> run_levanter_train_lm).
    # [dedup] pulls marin-dupekit: marin.processing.tokenize -> marin.datakit
    # .normalize imports it unconditionally, and marinfold_models.defaults
    # imports marin.training.training, so training needs it even though we do
    # no dedup.
    "marin-core[dedup]>=0.2.40.dev202607080801",
    "marinfold-models",
    "httpx>=0.28.1,<1",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# Installed on the TPU pod via `iris job run --extra tpu`. marin-core[tpu]
# pins the matched jax / jaxlib / libtpu triple (0.10.1 / 0.10.1 / 0.0.41);
# getting that trio from marin rather than pinning jax ourselves is what keeps
# us on the same runtime marin's training path is tested against.
#
# torch/torchvision are restated here on purpose. `tool.uv.sources` only routes
# *first-party* requirements, so the pytorch-cpu index mapping below would not
# reach them as transitive deps of marin-core — the resolve then fails with
# "there is no version of torchvision==0.26.0+cpu". marin-core's own pyproject
# restates them for exactly the same reason.
tpu = [
    "marin-core[tpu]>=0.2.40.dev202607080801",
    "torch==2.11.0",
    "torchvision==0.26.0+cpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision==0.26.0; sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[dependency-groups]
dev = []

[tool.uv.sources]
# GIT dep, not a relative path: the iris workspace bundle is only this
# experiment dir, so `../../marinfold` fails in a pod with "Could not compute
# absolute path from workspace root and lockfile path". Pinned to the series
# branch (the <retract> token + read.py fold are not on main yet).
marinfold-models = { git = "https://github.com/Open-Athena/MarinFold.git", subdirectory = "models", branch = "exp160-backtracking-training" }
# marin-core[tpu] requires `torchvision==0.26.0+cpu`, which exists only on the
# PyTorch CPU index. uv index config is workspace-level and is NOT inherited
# from a dependency's own pyproject, so a consumer of marin-core[tpu] has to
# declare it — without this, `uv lock` fails with "there is no version of
# torchvision==0.26.0+cpu".
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
package = false
prerelease = "allow"
environments = ["sys_platform == 'linux'"]
