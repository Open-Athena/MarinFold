[project]
name = "exp350-complex-holdout-survival"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.3",
    "gemmi>=0.7",
    "marinfold[contacts-v1]",
    "matplotlib>=3.10",
    "pyarrow>=20",
    "requests>=2.32",
    "s3fs>=2026.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.uv.sources]
marinfold = { path = "../../marinfold" }
