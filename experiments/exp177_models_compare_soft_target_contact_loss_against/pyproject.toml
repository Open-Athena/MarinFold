[project]
name = "exp177-models-soft-target-contact-loss-h2h"
version = "0.1.0"
description = "Head-to-head TPU training comparison of contacts-v1 soft-target loss vs next-token CE."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fsspec",
    "gcsfs",
    "marin-core==0.2.0",
    "marin-dupekit<0.3",
    "marin-iris==0.2.0",
    "marin-levanter==0.2.0",
    "marin-rigging==0.2.0",
    "marin-zephyr==0.2.0",
    "marinfold",
    "marinfold-models",
    "numpy==2.3.5",
    "pyarrow==23.0.1",
    "transformers==5.12.1",
    "wandb==0.26.0",
]

[project.optional-dependencies]
tpu = ["marin-core[tpu]==0.2.0; sys_platform == 'linux'"]
cpu = [
    "marin-core[cpu]",
    "torch==2.11.0",
    "torchvision==0.26.0+cpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false
fork-strategy = "fewest"
prerelease = "allow"
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
override-dependencies = [
    "antlr4-python3-runtime==4.11",
    "datasets>=3.1.0,<4.0.0",
    "equinox>=0.11.10",
    "omegaconf>=2.4.0.dev4",
    "python-multipart>=0.0.22",
    "transformers==5.12.1",
    "jax==0.10.1",
    "jaxlib==0.10.1",
    "libtpu==0.0.41; sys_platform == 'linux'",
    "flax==0.12.4",
    "numpy==2.3.5",
    "pyarrow==23.0.1",
    "wandb==0.26.0",
    "wheel>=0.46.2",
]
find-links = [
    "https://github.com/marin-community/kitoken/releases/expanded_assets/kitoken-0.10.2-a3012f4",
]

[[tool.uv.index]]
name = "marin-resiliparse"
url = "https://marin-community.github.io/chatnoir-resiliparse/simple"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
resiliparse = { index = "marin-resiliparse" }
torch = [{ index = "pytorch-cpu", extra = "cpu" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }]
marin-core = { git = "https://github.com/marin-community/marin.git", subdirectory = "lib/marin", rev = "e0f3da13754169833115a9314496d4369ec33ff2" }
marin-fray = { git = "https://github.com/marin-community/marin.git", subdirectory = "lib/fray", rev = "e0f3da13754169833115a9314496d4369ec33ff2" }
marin-haliax = { git = "https://github.com/marin-community/marin.git", subdirectory = "lib/haliax", rev = "e0f3da13754169833115a9314496d4369ec33ff2" }
marin-iris = { git = "https://github.com/marin-community/marin.git", subdirectory = "lib/iris", rev = "e0f3da13754169833115a9314496d4369ec33ff2" }
marin-levanter = { git = "https://github.com/marin-community/marin.git", subdirectory = "lib/levanter", rev = "e0f3da13754169833115a9314496d4369ec33ff2" }
marin-rigging = { git = "https://github.com/marin-community/marin.git", subdirectory = "lib/rigging", rev = "e0f3da13754169833115a9314496d4369ec33ff2" }
marin-zephyr = { git = "https://github.com/marin-community/marin.git", subdirectory = "lib/zephyr", rev = "e0f3da13754169833115a9314496d4369ec33ff2" }
marinfold = { git = "https://github.com/Open-Athena/MarinFold.git", subdirectory = "marinfold", rev = "exp176/soft-target-loss-h2h" }
marinfold-models = { git = "https://github.com/Open-Athena/MarinFold.git", subdirectory = "models", rev = "exp176/soft-target-loss-h2h" }
