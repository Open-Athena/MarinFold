[project]
name = "marinfold-writeup-analysis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2", "pandas>=2.2", "matplotlib>=3.9", "plotly>=6.0", "pytest>=8.0", "pyarrow>=19", "scikit-learn>=1.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test_analysis.py", "test_af3_sampling.py", "test_af3_context.py", "test_pl5.py", "generation/test_training_source_search.py"]
