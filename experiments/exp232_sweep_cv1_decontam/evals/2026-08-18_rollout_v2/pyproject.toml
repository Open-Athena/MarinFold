[project]
name = "exp232-rollout-v2-evals"
version = "0.1.0"
description = "CoreWeave rollout evaluation of selected exp232 decontaminated checkpoints."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiobotocore==2.26.0",
    "fsspec==2026.1.0",
    "huggingface-hub[hf-xet]>=0.34,<1",
    "httpx==0.28.1",
    "marin-fray==0.2.73.dev30987879744",
    "marin-iris==0.2.73.dev30987879744",
    "matplotlib>=3.10,<4",
    "numpy>=2,<3",
    "pandas>=3,<4",
    "pyarrow>=23,<24",
    "s3fs==2026.1.0",
    "scikit-learn>=1.8,<2",
    "scipy>=1.17,<2",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[tool.uv]
package = false
fork-strategy = "fewest"
prerelease = "allow"
environments = ["sys_platform == 'linux'"]
