[project]
name = "exp232-models-sweep-cv1-decontam"
version = "0.1.0"
description = "CoreWeave tokenization and GPU sweep for MarinFold issue #232."
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.1,<9",
    "fsspec",
    "hf-xet",
    "huggingface-hub>=1.5,<2",
    "marin-core==0.2.73.dev30987879744",
    "marin-dupekit==0.1.5.dev30957455498",
    "marin-dupekit-native==0.1.5.dev30957455498",
    "marin-finelog==0.2.22.dev31066648311",
    "marin-finelog-server==0.2.22.dev31066648311",
    "marin-iris==0.2.73.dev30987879744",
    "marin-iris-native==0.1.5.dev30223685542",
    "s3fs",
]

[project.optional-dependencies]
gpu = [
    "marin-core[gpu]==0.2.73.dev30987879744; sys_platform == 'linux'",
    # Bypass NVIDIA's PyPI placeholder package on x86 workers. Multi-node
    # cold starts otherwise fail nondeterministically while the placeholder
    # discovers this exact wheel from pypi.nvidia.com.
    "nvidia-cudnn-cu13 @ https://pypi.nvidia.com/nvidia-cudnn-cu13/nvidia_cudnn_cu13-9.26.0.28.dev61599045-py3-none-manylinux_2_27_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
fork-strategy = "fewest"
prerelease = "allow"
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "gpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", extra = "gpu", marker = "sys_platform == 'linux'" }]
