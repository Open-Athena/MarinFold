[project]
name = "exp262-models-nope-token-smearing"
version = "0.1.0"
description = "Phase 0 probes for issue #262: does the trained contacts-v1 model use RoPE for anything a width-3 causal token smear would not supply? Local-GPU (HF transformers) attention and offset analysis on the default cooldown checkpoint."
requires-python = ">=3.11,<3.13"
dependencies = [
    "marinfold[transformers]",  # build_document / residues_from_sequence + torch/accelerate
    "transformers>=4.51,<5",    # Qwen3 support; <5 so the levanter llama3 rope config loads
    "torch>=2.4",
    "accelerate>=0.30",
    "safetensors",
    "huggingface_hub>=0.24",
    "pyarrow",
    "pandas>=2.0",
    "numpy",
    "matplotlib",
    "wandb>=0.29.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.uv.sources]
marinfold = { path = "../../marinfold", editable = true }

[dependency-groups]
dev = []

[tool.uv]
package = false
prerelease = "allow"
environments = ["sys_platform == 'linux'"]
