[project]
name = "exp91-eval-esmfold2-atlas"
version = "0.1.0"
description = "Evaluate the ESMFold2 / ESM Atlas for training-set expansion (characterization + leakage)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyarrow>=16",
    "pylance>=0.18",
    "duckdb>=1.1",
    "pandas>=2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "gemmi>=0.6",
    "requests>=2.31",
    "zstandard>=0.22",
    "brotli>=1.1",
    "msgpack>=1.0",
    "msgpack-numpy>=0.4.8",
    "biopython>=1.83",
    "boto3>=1.34",
]

[tool.uv]
package = false
fork-strategy = "fewest"
