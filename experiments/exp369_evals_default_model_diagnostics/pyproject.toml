[project]
name = "exp369-default-model-diagnostics"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "biopython>=1.85",
    "fsspec>=2026.1",
    "gemmi>=0.7",
    "huggingface-hub>=1.5",
    "matplotlib>=3.10",
    "mdtraj>=1.11.2",
    "numpy>=2",
    "pandas>=2.3",
    "pyarrow>=19",
    "pyconfind>=0.5",
    "pyyaml>=6",
    "requests>=2.32",
    "scipy>=1.15",
    "tmtools>=0.3.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
