[project]
name = "exp157-models-fixed-position-embeddings"
version = "0.1.0"
description = "Replace learned contacts-v1 residue position input-token embeddings with fixed RoPE-style vectors."
requires-python = ">=3.12,<3.13"
dependencies = [
    "equinox>=0.11.10",
    "marin-levanter>=0.2.65.dev30616178224,<0.3",
    "optax>=0.2.4",
    "pytest>=8",
]

[project.optional-dependencies]
# Iris submission uses --extra cpu for lightweight smoke jobs.
cpu = []

[tool.uv]
package = false
prerelease = "allow"
# Current JAX wheels required by marin-levanter are available on Linux and
# Apple Silicon macOS, but not this workspace's macOS x86_64 host. Resolve the
# experiment for the Linux TPU/CPU workers where the smoke/training jobs run.
environments = [
    "sys_platform == 'linux'",
]
