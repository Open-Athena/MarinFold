[project]
name = "exp260-msa-depth-rollout"
version = "0.1.0"
description = "CoreWeave rollout evaluation of the #232 training checkpoint over the 887-unit legacy + FoldBench union (exp260)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiobotocore==2.26.0",
    "fsspec==2026.1.0",
    "huggingface-hub[hf-xet]>=1.5,<2",
    "httpx==0.28.1",
    "marin-fray==0.2.92.dev32937879514",
    "marin-iris==0.2.92.dev32937879514",
    "matplotlib>=3.10,<4",
    "numpy>=2,<3",
    "pandas>=3,<4",
    "pyarrow>=23,<24",
    "s3fs==2026.1.0",
    "scikit-learn>=1.8,<2",
    "scipy>=1.17,<2",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[tool.uv]
package = false
fork-strategy = "fewest"
prerelease = "allow"
environments = ["sys_platform == 'linux'"]
