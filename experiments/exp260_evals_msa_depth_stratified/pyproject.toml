[project]
name = "exp260-msa-depth"
version = "0.1.0"
description = "MSA-depth stratification of contacts-v1 accuracy over the natural eval universe (exp260)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib>=3.10,<4",
    "modal>=1.3,<2",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "scipy>=1.13,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.uv]
package = false
