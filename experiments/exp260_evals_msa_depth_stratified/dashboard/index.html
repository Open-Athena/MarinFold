// Deep-linkable: #<stem> selects a case, so a specific protein can be sent to
// someone as a URL.
const fromHash = () => PROTEINS.find((p) => p.stem === decodeURIComponent(location.hash.slice(1)));
let current = fromHash() || PROTEINS[0];
let layer = MF;
let sortKey = "msa_depth";
let sortDir = 1;
let viewer = null;

const fmt = (x, d = 3) => (x === undefined || x === null || Number.isNaN(x)) ? "—" : x.toFixed(d);
const scoreOf = (p, name) => p.r_precision[SCORE_KEYS[name]];
const predictors = (p) => ORDER.filter((name) => p.contacts[name]);

document.getElementById("blurb").textContent =
  `${PROTEINS.length} proteins: ` +
  ["CAMEO hard", "CASP free-modeling", "FoldBench"]
    .map((s) => `${PROTEINS.filter((p) => p.source === s).length} ${s}`).join(", ") +
  `. Predicted contacts are each predictor's top-L pairs; a pair counts as a contact at ` +
  `≥${DATA.contact_definition.min_degree} degree and ≥${DATA.contact_definition.min_separation} residues of separation.`;
document.getElementById("provenance").innerHTML =
  `Scores: <code>${DATA.generated_from.checkpoint}</code>. Built by <code>exp260/dashboard/build_dashboard_data.py</code> ` +
  `from <a href="${DATA.generated_from.scores}">the published run</a>.`;
document.getElementById("footer").textContent =
  "Ground-truth coordinates are Cα traces from RCSB (or the CASP domain tarball), aligned onto the evaluation " +
  "sequence; per-protein alignment coverage is shown with each structure. Contact maps and scores share one " +
  "residue numbering, so a pair drawn on the map is the pair the metric counted.";

// ---------- protein list ----------
const COLUMNS = [
  { key: "stem", label: "protein", get: (p) => p.stem, text: true },
  { key: "source", label: "source", get: (p) => p.source, text: true },
  { key: "L", label: "L", get: (p) => p.L },
  { key: "msa_depth", label: "depth", get: (p) => p.msa_depth },
  { key: "marinfold", label: "MarinFold", get: (p) => scoreOf(p, MF) },
  { key: "msa_arm", label: "+MSA", get: (p) => scoreOf(p, "Protenix-v2 + MSA") },
];

function renderList() {
  const rows = [...PROTEINS].sort((a, b) => {
    const column = COLUMNS.find((c) => c.key === sortKey);
    const x = column.get(a), y = column.get(b);
    if (x === undefined || x === null) return 1;
    if (y === undefined || y === null) return -1;
    return (column.text ? String(x).localeCompare(String(y)) : x - y) * sortDir;
  });
  const head = COLUMNS.map((c) =>
    `<th data-key="${c.key}" class="${c.key === sortKey ? "sorted" : ""}">${c.label}</th>`).join("");
  const body = rows.map((p) => `
    <tr data-key="${p.key}" class="${p.key === current.key ? "active" : ""}">
      <td>${p.stem}${p.in_foldbench ? ' <span class="badge fb">FB</span>' : ""}</td>
      <td>${p.source}</td>
      <td>${p.L}</td>
      <td>${p.msa_depth}</td>
      <td>${fmt(scoreOf(p, MF))}</td>
      <td>${fmt(scoreOf(p, "Protenix-v2 + MSA"))}</td>
    </tr>`).join("");
  document.getElementById("list").innerHTML =
    `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  document.querySelectorAll("#list th").forEach((th) => th.onclick = () => {
    const key = th.dataset.key;
    sortDir = key === sortKey ? -sortDir : (key === "stem" || key === "source" ? 1 : 1);
    sortKey = key;
    renderList();
  });
  document.querySelectorAll("#list tbody tr").forEach((tr) => tr.onclick = () => {
    current = PROTEINS.find((p) => p.key === tr.dataset.key);
    history.replaceState(null, "", `#${current.stem}`);
    if (!predictors(current).includes(layer)) layer = predictors(current)[0];
    renderList();
    renderDetail();
  });
}

// ---------- contact map ----------
function drawMap(protein, name) {
  const canvas = document.getElementById("map");
  const size = 620, L = protein.L;
  canvas.width = size; canvas.height = size;
  const context = canvas.getContext("2d");
  const style = getComputedStyle(document.body);
  const scale = size / L;
  // A 35-residue protein would otherwise draw 22-pixel blocks.
  const pixel = Math.min(7, Math.max(1.5, scale * 1.4));
  context.fillStyle = style.getPropertyValue("--bg"); context.fillRect(0, 0, size, size);

  const truth = new Set(protein.contacts[GT].map(([i, j]) => i * L + j));
  const dot = (i, j, color) => {
    context.fillStyle = color;
    context.fillRect(j * scale - pixel / 2, i * scale - pixel / 2, pixel, pixel);
  };
  // Lower triangle: the answer. Upper triangle: this predictor against it.
  for (const [i, j] of protein.contacts[GT]) dot(j, i, style.getPropertyValue("--gt"));
  const predicted = protein.contacts[name] || [];
  for (const [i, j] of predicted) {
    const hit = truth.has(i * L + j);
    dot(i, j, style.getPropertyValue(hit ? "--good" : "--bad"));
  }
  context.strokeStyle = style.getPropertyValue("--line");
  context.lineWidth = 1;
  context.beginPath(); context.moveTo(0, 0); context.lineTo(size, size); context.stroke();
  context.strokeRect(0.5, 0.5, size - 1, size - 1);
  // Residue ruler, so a contact can be read off the map by number.
  const step = L <= 60 ? 10 : L <= 150 ? 25 : L <= 300 ? 50 : 100;
  context.fillStyle = style.getPropertyValue("--muted");
  context.font = "11px ui-monospace, monospace";
  for (let residue = step; residue < L; residue += step) {
    const at = residue * scale;
    context.globalAlpha = 0.25;
    context.beginPath(); context.moveTo(at, 0); context.lineTo(at, size); context.stroke();
    context.beginPath(); context.moveTo(0, at); context.lineTo(size, at); context.stroke();
    context.globalAlpha = 1;
    context.fillText(String(residue), at + 3, 12);
  }

  const hits = predicted.filter(([i, j]) => truth.has(i * L + j)).length;
  document.getElementById("map-caption").innerHTML =
    `<b>${name}</b>: ${hits} of ${predicted.length} top-L pairs are true contacts ` +
    `(${predicted.length ? (100 * hits / predicted.length).toFixed(0) : 0}%). ` +
    `Ground truth has ${protein.n_true_contacts} contacts.`;
}

// ---------- 3D ----------
function pdbText(protein) {
  const lines = [];
  protein.structure.coordinates.forEach((xyz, index) => {
    if (!xyz) return;
    const [x, y, z] = xyz;
    const residue = (index + 1).toString().padStart(4, " ");
    lines.push(
      "ATOM  " + (index + 1).toString().padStart(5, " ") + "  CA  ALA A" + residue +
      "    " + x.toFixed(3).padStart(8, " ") + y.toFixed(3).padStart(8, " ") +
      z.toFixed(3).padStart(8, " ") + "  1.00  0.00           C"
    );
  });
  return lines.join("\n") + "\nEND\n";
}

function draw3D(protein, name) {
  const host = document.getElementById("viewer");
  if (typeof $3Dmol === "undefined") {
    host.innerHTML = '<p style="padding:12px;color:var(--muted)">The 3D viewer library ' +
      '(3Dmol.js, loaded from a CDN) is unavailable offline. Contact maps below are unaffected.</p>';
    return;
  }
  if (!protein.structure.available) {
    host.innerHTML = `<p style="padding:12px;color:var(--muted)">No coordinates: ${protein.structure.reason}</p>`;
    return;
  }
  host.innerHTML = "";
  viewer = $3Dmol.createViewer(host, { backgroundColor: getComputedStyle(document.body).getPropertyValue("--panel") });
  viewer.addModel(pdbText(protein), "pdb");
  viewer.setStyle({}, { cartoon: { style: "trace", color: "spectrum", thickness: 0.3 } });

  const coordinates = protein.structure.coordinates;
  const L = protein.L;
  const truth = new Set(protein.contacts[GT].map(([i, j]) => i * L + j));
  for (const [i, j] of (protein.contacts[name] || [])) {
    if (!coordinates[i] || !coordinates[j]) continue;
    viewer.addCylinder({
      start: { x: coordinates[i][0], y: coordinates[i][1], z: coordinates[i][2] },
      end: { x: coordinates[j][0], y: coordinates[j][1], z: coordinates[j][2] },
      radius: 0.12,
      color: truth.has(i * L + j) ? "green" : "red",
      fromCap: 1, toCap: 1,
    });
  }
  viewer.zoomTo();
  viewer.render();
}

// ---------- MSA ----------
function msaHtml(a3m) {
  const rows = [];
  let header = null, sequence = [];
  for (const line of a3m.split("\n")) {
    if (line.startsWith(">")) {
      if (header !== null) rows.push([header, sequence.join("")]);
      header = line.slice(1).trim(); sequence = [];
    } else if (line.trim()) sequence.push(line.trim());
  }
  if (header !== null) rows.push([header, sequence.join("")]);
  return rows.map(([name, seq], index) =>
    `<span class="${index === 0 ? "q" : ""}">${(index === 0 ? "query" : name).slice(0, 28).padEnd(30, " ")}` +
    `${seq.replace(/[a-z]/g, "")}</span>`).join("\n");
}

// ---------- detail ----------
function renderDetail() {
  const p = current;
  const available = predictors(p);
  const best = Math.max(...available.map((name) => scoreOf(p, name) || 0), 0.001);
  const structure = p.structure.available
    ? `${p.structure.pdb_id} chain ${p.structure.chain} · ${(100 * p.structure.coverage).toFixed(0)}% of the sequence has coordinates`
    : `unavailable (${p.structure.reason})`;
  document.getElementById("detail").innerHTML = `
    <h2 style="margin:0 0 4px">${p.stem}
      <span class="badge ${p.in_foldbench ? "fb" : ""}">${p.source}</span>
      ${p.eval_set ? `<span class="badge">${p.eval_set}</span>` : ""}
      <span class="badge">${p.in_foldbench ? "in FoldBench" : "not in FoldBench"}</span>
    </h2>
    <div class="controls" id="layers">
      ${available.map((name) =>
        `<button data-layer="${name}" class="${name === layer ? "on" : ""}">${name}</button>`).join("")}
    </div>
    <div class="grid">
      <div class="card">
        <h3>Ground-truth structure</h3>
        <div id="viewer"></div>
        <div class="legend">
          <span><span class="swatch" style="background:var(--good)"></span>predicted pair, correct</span>
          <span><span class="swatch" style="background:var(--bad)"></span>predicted pair, wrong</span>
        </div>
        <p style="color:var(--muted);font-size:12px;margin:6px 0 0">${structure}</p>
      </div>
      <div class="card">
        <h3>Contact map</h3>
        <canvas id="map"></canvas>
        <p id="map-caption" style="font-size:12px;margin:8px 0 0"></p>
        <div class="legend">
          <span><span class="swatch" style="background:var(--gt)"></span>ground truth (lower)</span>
          <span><span class="swatch" style="background:var(--good)"></span>correct (upper)</span>
          <span><span class="swatch" style="background:var(--bad)"></span>wrong (upper)</span>
        </div>
      </div>
      <div class="card">
        <h3>This protein</h3>
        <div class="kv">
          <div>length</div><div>${p.L} residues</div>
          <div>ColabFold MSA depth</div><div><b>${p.msa_depth}</b> sequences</div>
          <div>Neff (80% id)</div><div>${p.msa_neff}</div>
          <div>true contacts</div><div>${p.n_true_contacts}</div>
          <div>evaluation unit</div><div><code>${p.dataset}__${p.stem}</code></div>
        </div>
        <h3 style="margin-top:14px">R-precision (all ranges)</h3>
        <div class="bars">
          ${ORDER.filter((name) => scoreOf(p, name) !== undefined).map((name) => `
            <div>${name === MF ? "<b>MarinFold</b>" : name}</div>
            <div><div class="bar ${name === MF ? "self" : ""}" style="width:${100 * scoreOf(p, name) / best}%"></div></div>
            <div>${fmt(scoreOf(p, name))}</div>`).join("")}
        </div>
      </div>
      <div class="card">
        <h3>The alignment (${p.msa_depth} sequence${p.msa_depth === 1 ? "" : "s"}, insertions stripped)</h3>
        <pre class="msa">${msaHtml(p.a3m)}</pre>
      </div>
    </div>`;
  document.querySelectorAll("#layers button").forEach((button) => button.onclick = () => {
    layer = button.dataset.layer;
    renderDetail();
  });
  drawMap(p, layer);
  draw3D(p, layer);
}

window.addEventListener("hashchange", () => {
  const selected = fromHash();
  if (selected && selected.key !== current.key) {
    current = selected;
    if (!predictors(current).includes(layer)) layer = predictors(current)[0];
    renderList();
    renderDetail();
  }
});

renderList();
renderDetail();
</script>
</body>
</html>
