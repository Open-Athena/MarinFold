[project]
name = "exp335-helico-decoy-ranking"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "gemmi>=0.7",
  "httpx==0.28.1",
  "marin-finelog-server==0.2.46.dev33324331711",
  "marin-fray==0.2.0",
  "marin-iris[controller]==0.2.0",
  "marin-iris-native==0.1.6.dev31131847556",
  "matplotlib>=3.9",
  "modal>=1.3",
  "pyconfind>=0.6",
  "s3fs>=2026.1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
prerelease = "allow"
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
# Pin the exact controller-era Marin revision used to launch the production
# jobs. The public 0.2.0 version alone does not identify this moving source API.
marin-fray = { git = "https://github.com/marin-community/marin.git", rev = "eee467718515b2383fc3a433014afce4ab075b05", subdirectory = "lib/fray" }
marin-iris = { git = "https://github.com/marin-community/marin.git", rev = "eee467718515b2383fc3a433014afce4ab075b05", subdirectory = "lib/iris" }
