[project]
name = "exp281-iterated-contact-sft"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "marinfold", "numpy", "pyarrow", "fsspec", "s3fs", "gcsfs",
  "torch==2.8.0", "transformers==4.57.6", "wandb>=0.21,<0.22",
]

[project.optional-dependencies]
generation = ["vllm==0.11.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff", "pyrefly"]

[tool.uv]
package = false

[tool.uv.sources]
marinfold = { path = "../../marinfold", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
