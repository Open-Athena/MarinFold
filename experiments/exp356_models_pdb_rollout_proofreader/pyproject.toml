[project]
name = "exp356-pdb-rollout-proofreader"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "transformers==5.3.0",
  "huggingface-hub==1.7.1",
  "pyarrow==23.0.1",
  "fsspec==2026.2.0",
  "s3fs==2026.2.0",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "gemmi==0.7.5",
  "wandb==0.25.1",
  "matplotlib==3.10.8",
  "scikit-learn==1.8.0",
]
[project.optional-dependencies]
train = ["torch==2.10.0"]
[dependency-groups]
dev = ["pytest==9.0.2"]
[tool.uv]
package = false
prerelease = "allow"
environments = ["sys_platform == 'linux'"]
