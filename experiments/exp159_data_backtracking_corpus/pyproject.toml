[project]
name = "exp159-backtracking-corpus"
version = "0.0.0"
description = "Model-in-the-loop backtracking corpus engine + pilot (issue #159)"
requires-python = ">=3.12,<3.14"  # marin-fray supports 3.12-3.13
dependencies = [
    "marinfold",
    # GPU inference of the exp120 1.5B model. The host runs CUDA 12.2, so torch
    # is pinned to a +cu121 wheel (the pin exp89/exp20 settled on for this box)
    # routed through the pytorch-cu121 index below.
    "torch==2.5.1+cu121",
    "accelerate>=0.30",
    "transformers>=4.45,<5",
    # Pilot I/O: exp98 targets.parquet (GT + sequences) from the public bucket.
    "pandas>=2.0",
    "pyarrow",
    "huggingface_hub>=0.24",
    "numpy",
    # marin runtime in BASE (not an extra): the iris job env installs base deps
    # only, and the driver imports fray to submit child JobRequests. Dev line
    # (not the frozen marin-*-latest assets) because JobRequest.priority — the
    # batch-band field — only exists on the 0.2.x.dev line.
    "marin-fray>=0.2.40.dev202607080801",
    "marin-iris>=0.2.40.dev202607080801",
    # httpx MUST stay <1: with prerelease=allow uv otherwise picks the broken
    # httpx 1.0.dev*, whose aiobotocore shim breaks every iris import (exp53).
    "httpx>=0.28.1,<1",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# Worker extra for CoreWeave H100 dispatch (create_environment(extras=["gpu"])).
# torch is already a top-level dep: the +cu121 wheel carries sm_90 kernels, so
# the same pin serves this box (CUDA 12.2 driver) and the H100 nodes.
gpu = ["accelerate>=0.30"]


[dependency-groups]
dev = []

[tool.uv.sources]
# marinfold is a GIT dep (not a local path) so the SAME pyproject resolves on
# remote CoreWeave workers, which cannot see this checkout — a relative
# `../../marinfold` fails there with "cannot normalize a relative path beyond
# the base directory". Pinned to this series' branch because the <retract>
# token + read.py fold (#158) are not on main yet; repoint to main once PR #161
# merges. (Same pattern as exp139.)
marinfold = { git = "https://github.com/Open-Athena/MarinFold.git", subdirectory = "marinfold", branch = "exp159-backtracking-corpus" }
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv]
package = false
prerelease = "allow"
environments = ["sys_platform == 'linux'"]
