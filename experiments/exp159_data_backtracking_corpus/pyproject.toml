[project]
name = "exp159-backtracking-corpus"
version = "0.0.0"
description = "Model-in-the-loop backtracking corpus engine + pilot (issue #159)"
requires-python = ">=3.11"
dependencies = [
    "marinfold",
    # GPU inference of the exp120 1.5B model. The host runs CUDA 12.2, so torch
    # is pinned to a +cu121 wheel (the pin exp89/exp20 settled on for this box)
    # routed through the pytorch-cu121 index below.
    "torch==2.5.1+cu121",
    "accelerate>=0.30",
    "transformers>=4.45,<5",
    # Pilot I/O: exp98 targets.parquet (GT + sequences) from the public bucket.
    "pandas>=2.0",
    "pyarrow",
    "huggingface_hub>=0.24",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# Worker extra for CoreWeave H100 dispatch (create_environment(extras=["gpu"])).
# torch is already a top-level dep: the +cu121 wheel carries sm_90 kernels, so
# the same pin serves this box (CUDA 12.2 driver) and the H100 nodes.
gpu = ["accelerate>=0.30"]
# Submitting iris jobs needs a client that passes the 14-day freshness gate.
dispatch = ["marin-iris", "marin-fray"]

[tool.uv.sources]
marinfold = { path = "../../marinfold", editable = true }
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv]
package = false
prerelease = "allow"
environments = ["sys_platform == 'linux'"]
