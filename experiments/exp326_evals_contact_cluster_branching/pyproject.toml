[project]
name = "exp326-evals-contact-cluster-branching"
version = "0.1.0"
description = "Coherent contact-cluster branching for oracle contacts-v1 rollouts."
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=2,<3",
    "pandas>=3,<4",
    "pyarrow>=23,<26",
    "scipy>=1.17,<2",
    "transformers==5.15.0",
    "vllm==0.19.1",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]
