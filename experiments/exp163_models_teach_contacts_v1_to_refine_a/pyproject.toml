[project]
name = "exp163-models-teach-contacts-v1-refine"
version = "0.1.0"
description = "exp163 rollout-refinement: refiner fine-tune + rollout-gen driver on CoreWeave rno-2a H100 — issue #163."
requires-python = ">=3.12,<3.13"
dependencies = [
    # marin SOURCE dists from PyPI (fixed 0.2.x.dev cache-ledger reader; <0.3 keeps
    # the frozen 0.99.dev wheels from winning on version ordering). Same rationale as exp108.
    "marin-core>=0.2.5.dev202606020954,<0.3",
    "marin-levanter>=0.2.5.dev202606020954,<0.3",
    "marin-iris[controller]>=0.2.5.dev202606020954,<0.3",
    "marin-zephyr>=0.2.5.dev202606020954,<0.3",
    "marin-rigging>=0.2.5.dev202606020954,<0.3",
    "marinfold-models",
    "marin-dupekit<0.3",
    "fsspec", "numpy", "pyarrow", "transformers", "tokenizers",
    "s3fs", "boto3",
    # NB: no huggingface-hub>=1.5 pin (marin-levanter's transformers needs hf<1.0).
]

[project.optional-dependencies]
gpu = ["marin-core[gpu]; sys_platform == 'linux'"]
cpu = [
    "marin-core[cpu]",
    "torch==2.11.0",
    "torchvision==0.26.0+cpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
fork-strategy = "fewest"
prerelease = "allow"
environments = ["sys_platform == 'linux'"]
override-dependencies = [
    "omegaconf>=2.4.0.dev4", "antlr4-python3-runtime==4.11",
    "python-multipart>=0.0.22", "wheel>=0.46.2",
    "datasets>=3.1.0,<4.0.0", "equinox>=0.11.10",
]
find-links = [
    "https://github.com/marin-community/kitoken/releases/expanded_assets/kitoken-0.10.2-a3012f4",
]

[[tool.uv.index]]
name = "marin-resiliparse"
url = "https://marin-community.github.io/chatnoir-resiliparse/simple"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
resiliparse = { index = "marin-resiliparse" }
torch = [{ index = "pytorch-cpu", extra = "cpu" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }]
marinfold-models = { git = "https://github.com/Open-Athena/MarinFold.git", subdirectory = "models", rev = "19d23d227414d508408004cad436bc699e7ad5f5" }
