[project]
name = "marinfold-exp336"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.2",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pyarrow>=18",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
